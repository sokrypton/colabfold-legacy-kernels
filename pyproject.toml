[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colabfold-legacy-kernels"
version = "0.3.0.dev0"
description = "Prebuilt pre-Ampere (sm_70 / sm_75) CUDA kernels for ColabFold."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Milot Mirdita", email = "milot@mirdita.de" }]
keywords = ["alphafold", "colabfold", "cuda", "volta", "turing", "v100", "t4", "bioinformatics"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
]

[project.urls]
Homepage = "https://github.com/mirditalab/colabfold-legacy-kernels"
Issues = "https://github.com/mirditalab/colabfold-legacy-kernels/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colabfold_legacy_kernels = ["kernels/*/*.so"]
